# Nombre de la aplicacion
spring.application.name=ppai

# Conexion a la base de datos
# Para PostgreSQL (cuando este disponible):
# spring.datasource.url=jdbc:postgresql://localhost:5432/red_sismica
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Para H2 (desarrollo temporal - base de datos en memoria):
spring.datasource.url=jdbc:h2:mem:red_sismica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuracion de JPA/Hibernate
# Opciones para ddl-auto:
#   - none: no valida ni crea esquema (útil para desarrollo si BD no está disponible)
#   - validate: valida el esquema contra la BD (requiere BD corriendo)
#   - update: actualiza el esquema según las entidades
#   - create: crea el esquema (cuidado: borra datos existentes)
#   - create-drop: crea al inicio y elimina al finalizar
#
# Configuracion de JPA/Hibernate
# Para PostgreSQL usar: org.hibernate.dialect.PostgreSQLDialect
# Para H2 usar: org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (opcional, accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion para permitir iniciar sin BD (solo para desarrollo)
# IMPORTANTE: Cuando tengas PostgreSQL corriendo y la BD lista:
# 1. Elimina el 'exclude' de @SpringBootApplication en PpaiApplication.java
# 2. Descomenta las líneas de abajo para habilitar JPA
# spring.jpa.enabled=true

# Inicializacion de datos (opcional)
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data/ddl.sql
