# Nombre de la aplicacion
spring.application.name=ppai

# ? Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ppai
spring.datasource.username=app_userr
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver


# ?? JPA / Hibernate
# El ddl-auto=create-drop funciona, pero para que se creen al inicio
# puedes usar 'update' si no quieres que se borren los datos entre reinicios.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# **IMPORTANTE:** Solo usa una de las siguientes líneas para el dialecto,
# la segunda es la preferida por ser la sintaxis estándar de Hibernate/JPA:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect <--- Opcional, pero no necesario si usas la siguiente
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect