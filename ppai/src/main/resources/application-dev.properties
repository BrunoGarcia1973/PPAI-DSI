# Configuracion para desarrollo con H2 (base de datos en memoria)
# Usar este perfil para desarrollar sin PostgreSQL instalado
# Ejecutar con: mvn javafx:run -Dspring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=ppai

# Conexion a H2 (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:red_sismica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA/Hibernate para H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (opcional, para ver la BD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

